; XRF-PORTABLE — the code-based XRF + coil on an ESP32
; PlatformIO project.  `pio run` compiles; nothing is flashed without you.
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wno-strict-aliasing
; the instrument's reading chain is self-contained: no external libraries
lib_deps =

; ----------------------------------------------------------------------------
; [env:esp32-s3] — the SAME source on the ESP32-S3 (the user-held board).
; No S3-specific or classic-only API is called anywhere (audited: zero hits
; for hallRead/touchRead/dacWrite/ledc*/BT*/ESP_S3 pins) — the instrument is
; chip-agnostic; only the BUILD TARGET changes.  USB flags: after the
; plug-in discovery (2026-11-03) the user's cable is the onboard USB-UART
; bridge port (COM7, "USB Serial Port" INF) — so `Serial` stays UART0
; (default CDC_ON_BOOT=0, no USB flags): prints readable + flash on the
; same port.  The native-connector variant is preserved commented below.
; ----------------------------------------------------------------------------
[env:esp32-s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wno-strict-aliasing
;    -D ARDUINO_USB_MODE=1
;    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
